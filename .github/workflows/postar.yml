name: Postar ofertas

on:
  schedule:
    # Horários em UTC. Brasília = UTC-3 → 9h, 12h, 18h e 21h.
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Só testar (não posta nada)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rodada
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.teste }}" = "true" ]; then
            python -m bot.main --teste
          else
            python -m bot.main
          fi
      - name: Salvar histórico e site
        if: ${{ inputs.teste != true }}
        run: |
          git config user.name "maquina-ofertas"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Rodada $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase && git push
